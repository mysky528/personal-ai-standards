# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paisl"
version = "0.2.2"
description = "Tooling for the Personal AI Standards Library"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PAISL contributors" }]
keywords = ["standards", "agents", "governance", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
paisl = "paisl.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: a test that runs for a long time and runs apart from the suite",
]
