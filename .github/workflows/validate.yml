# SPDX-License-Identifier: MIT
name: Validate PAISL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate registry and Skills
        run: python scripts/validate.py

      - name: Install PAISL package
        run: python -m pip install -e ".[dev]"

      - name: Validate through the CLI
        run: python -m paisl validate

      - name: Report coverage
        run: python -m paisl coverage

      - name: Check the evidence registry
        run: python -m paisl evidence check

      - name: Run the test suite
        run: python -m pytest

      - name: Verify the working tree is clean
        run: test -z "$(git status --porcelain)"
